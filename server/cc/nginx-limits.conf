# Installed at /etc/nginx/conf.d/site-cc-limits.conf
#
# limit_req_zone has to live in the http context, which the site's server block
# in sites-available/portfolio is not. Debian's nginx.conf includes conf.d
# before sites-enabled, so the zone exists by the time the site refers to it.
#
# A compile costs about a second of CPU and 110 MB on a box with under 500 MB
# spare. Even with a single authorised caller that is worth a ceiling: the cost
# of a retry loop in a browser tab is the same whether or not it was deliberate.
limit_req_zone $binary_remote_addr zone=cc:1m rate=20r/m;
